config:
  MD013: false # line length — prose wraps where it reads best
  MD033: false # inline HTML — used deliberately in docs
  MD041: false # first line need not be a heading (frontmatter)
  MD024:
    siblings_only: true # ADRs repeat Context / Decision / Consequences
  MD060: false # table pipe spacing — |---|---| is valid and universal
globs:
  - "**/*.md"
ignores:
  - "node_modules/**"
  - ".venv/**"
  - "CHANGELOG.md" # generated by release-please
