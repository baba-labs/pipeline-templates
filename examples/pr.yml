# Example: the pull request workflow for a consuming repository.
#
# Copy to .github/workflows/pr.yml in your repository.
name: PR

on:
  pull_request:
    branches: [main]

# Belongs in the caller, not the reusable workflow: cancels superseded runs when
# someone pushes twice in a minute, which is most of the minutes you will save.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: baba-labs/pipeline-templates/.github/workflows/lint.yml@v1
    permissions:
      contents: read
      pull-requests: read

  # A repository with no Terraform needs no configuration — the Terraform jobs
  # detect their own irrelevance and skip. Override only to be explicit:
  #
  # lint:
  #   uses: baba-labs/pipeline-templates/.github/workflows/lint.yml@v1
  #   with:
  #     terraform: 'false'
  #     commit-lint: true      # only if this repo uses merge or rebase-merge

  # Runs every hook in .pre-commit-config.yaml over all files — the same checks
  # contributors run locally, including secret detection and actionlint.
  # requirements-dev.txt must be hash-locked (pip-compile --generate-hashes).
  pre-commit:
    uses: baba-labs/pipeline-templates/.github/workflows/pre-commit.yml@v1
    # with:
    #   skip-hooks: dotnet-format   # covered by the dotnet job below

  # .NET repositories only: locked restore, build, dotnet format verification
  # and tests. The test runner (VSTest or Microsoft.Testing.Platform) is read
  # from global.json.
  dotnet:
    uses: baba-labs/pipeline-templates/.github/workflows/dotnet.yml@v1
    with:
      solution: MyApp.slnx
      # For a project under src/, use solution: src/MyApp/MyApp.csproj
      # If its SDK is pinned there, set global-json-file: src/global.json
      # Set configuration: Debug if your repository needs a different build configuration
