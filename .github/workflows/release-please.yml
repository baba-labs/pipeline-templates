name: Release Please Workflow

on:
  # Reusable workflow interface only (called by other workflows)
  workflow_call:
    inputs:
      config-file:
        description: "Path to release-please config file"
        required: false
        type: string
        default: ".github/release-please-config.json"
      manifest-file:
        description: "Path to release-please manifest file"
        required: false
        type: string
        default: ".github/.release-please-manifest.json"
      update-major-tag:
        description: >-
          After a release, move the major version tag (for example v1) to it. Use for
          repositories consumed by tag, such as reusable workflows and actions.
        required: false
        type: boolean
        default: false

    outputs:
      tag_name:
        description: "Created tag name (if any)"
        value: ${{ jobs.release-please.outputs.tag_name }}
      release_created:
        description: "Boolean indicating whether a release was created"
        value: ${{ jobs.release-please.outputs.release_created }}

    secrets:
      RELEASE_MANAGER_APP_PRIVATE_KEY:
        description: "PEM of the GitHub App private key"
        required: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release-please.outputs.tag_name }}
      release_created: ${{ steps.release-please.outputs.release_created }}

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_MANAGER_APP_ID }}
          private-key: ${{ secrets.RELEASE_MANAGER_APP_PRIVATE_KEY }}

      - name: Release Please
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

      # release-please creates v1.2.3; consumers pin to v1. Moving v1 by hand is the
      # step that gets forgotten, so it happens here, in the same run as the release.
      - name: Check out the release
        if: inputs.update-major-tag && steps.release-please.outputs.release_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release-please.outputs.tag_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Move the major version tag
        if: inputs.update-major-tag && steps.release-please.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.release-please.outputs.tag_name }}
          MAJOR: v${{ steps.release-please.outputs.major }}
        run: |
          git tag --force "$MAJOR" "$TAG"
          git push --force origin "refs/tags/$MAJOR"
          echo "Moved \`$MAJOR\` to \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"
