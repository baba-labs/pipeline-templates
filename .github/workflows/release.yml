name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-please.yml
    with:
      config-file: .github/release-please-config.json
      manifest-file: .github/.release-please-manifest.json
      # Consumers pin to @v1, so every release here must move it.
      update-major-tag: true
    secrets:
      RELEASE_MANAGER_APP_PRIVATE_KEY: ${{ secrets.RELEASE_MANAGER_APP_PRIVATE_KEY }}
