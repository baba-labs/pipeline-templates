name: PR

# This repository checks itself with its own reusable workflows, using local
# references. It is the cheapest way to find out that a change here is broken
# before it breaks every repository that pins the tag.

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
      pull-requests: read

  # Contributors here work on macOS and Windows, so the hooks are proven on both.
  pre-commit:
    name: Pre-commit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    uses: ./.github/workflows/pre-commit.yml
    with:
      runs-on: ${{ matrix.os }}
