name: Pre-commit Workflow

on:
  # Reusable workflow interface only (called by other workflows)
  workflow_call:
    inputs:
      python-version:
        description: "Python version used to install and run pre-commit"
        required: false
        type: string
        default: "3.13"
      requirements-file:
        description: >-
          Hash-locked requirements file that installs pre-commit (for example the output of
          pip-compile --generate-hashes). Installed with --require-hashes --only-binary :all:.
        required: false
        type: string
        default: "requirements-dev.txt"
      skip-hooks:
        description: >-
          Comma-separated hook IDs to skip (pre-commit's SKIP variable), for hooks another job
          already covers or whose toolchain this runner does not have.
        required: false
        type: string
        default: ""
      runs-on:
        description: "Runner label. Call the workflow from a matrix to cover several operating systems."
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Runs every hook in the repository's .pre-commit-config.yaml over all files,
  # so CI enforces exactly what contributors run locally — including checks the
  # lint workflow has no job for, such as secret detection and actionlint.
  # ---------------------------------------------------------------------------
  pre-commit:
    name: Pre-commit
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements-file }}

      # Hash-locked and wheels only: nothing unpinned is resolved, and no package's
      # setup script runs on the runner.
      - name: Install pre-commit
        shell: bash
        env:
          REQUIREMENTS: ${{ inputs.requirements-file }}
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r "$REQUIREMENTS"

      - name: Run pre-commit
        shell: bash
        env:
          SKIP: ${{ inputs.skip-hooks }}
        run: |
          {
            echo "### Pre-commit"
            echo ""
            if [ -n "$SKIP" ]; then
              echo "Skipped hooks (caller input \`skip-hooks\`): \`$SKIP\`"
            else
              echo "Every hook ran; none skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          pre-commit run --all-files --show-diff-on-failure
